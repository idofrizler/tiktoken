name: ClaudeCreditsWatch

options:
  bundleIdPrefix: com.idofrizler
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "10.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    SWIFT_VERSION: "5.0"

targets:
  ClaudeCreditsWatch:
    type: application
    platform: watchOS
    sources:
      - path: ClaudeCreditsWatch
        excludes:
          - Assets.xcassets
          - Info.plist
    resources:
      - path: ClaudeCreditsWatch/Assets.xcassets
    info:
      path: ClaudeCreditsWatch/Info.plist
      properties:
        CFBundleDisplayName: Credit Aliens
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.idofrizler.ClaudeCreditsWatch
        PRODUCT_NAME: "$(TARGET_NAME)"
        TARGETED_DEVICE_FAMILY: 4

schemes:
  ClaudeCreditsWatch:
    build:
      targets:
        ClaudeCreditsWatch: all
    run:
      config: Debug
